<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9fc">
<title>Proxy · 登录原型</title>
<style>
:root{
  --bg:#f8f6fb;--surface:#fff;--soft:#f5f2f8;--text:#171522;
  --muted:#928c9d;--line:#e7e2ec;--purple:#7546ff;--purple2:#a865ff;
  --pink:#ec78a6;--danger:#d94d6a;--shadow:0 10px 30px rgba(43,25,75,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",
  "Helvetica Neue",Arial,sans-serif;color:var(--text);
  display:flex;justify-content:center;
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.app{
  width:min(100%,430px);min-height:100vh;padding:
  env(safe-area-inset-top) 22px env(safe-area-inset-bottom);
  background:linear-gradient(180deg,#fbfaff 0%,#fff 42%,#fff 100%);
}
.status{
  height:48px;display:flex;align-items:center;justify-content:space-between;
  font-size:17px;font-weight:700;letter-spacing:.1px
}
.status-icons{display:flex;gap:9px;align-items:center;font-size:15px}
.brand{text-align:center;padding:40px 0 38px}
.logo{
  width:92px;height:92px;margin:auto;border-radius:21px;background:#09090b;
  display:grid;place-items:center;box-shadow:0 12px 28px rgba(65,38,110,.12)
}
.logo svg{width:72px;height:72px}
.brand h1{font-size:50px;line-height:1;margin:19px 0 0;font-weight:800;letter-spacing:-2.2px}
.saved{
  display:flex;align-items:center;gap:14px;padding:17px 17px;
  border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.96);
  box-shadow:var(--shadow)
}
.avatar{width:60px;height:60px;border-radius:50%;background:#171522;color:#fff;
  display:grid;place-items:center;font-weight:750;font-size:26px;flex:none}
.saved-info{min-width:0;flex:1}
.saved-title{font-size:17px;font-weight:750}
.saved-email{font-size:14px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-actions{display:flex;align-items:center;gap:13px}
.primary-small{
  border:0;color:#fff;font-weight:700;font-size:15px;padding:12px 17px;border-radius:13px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));white-space:nowrap
}
.link{color:var(--purple);font-weight:700;white-space:nowrap;border:0;background:transparent;padding:0}
.tabs{
  margin-top:20px;padding:5px;background:var(--soft);border-radius:21px;
  display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:3px
}
.tab{
  height:48px;border:0;border-radius:17px;background:transparent;color:#817b8c;
  font-size:16px;font-weight:650;transition:.18s
}
.tab.active{background:#fff;color:var(--purple);box-shadow:0 2px 9px rgba(50,30,90,.06)}
.panel{padding:27px 3px 0}
.label{font-size:15px;color:var(--muted);margin:0 1px 15px}
.oauth{
  width:100%;height:58px;border:1px solid var(--line);border-radius:17px;background:#fff;
  display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:700;
  color:var(--text);box-shadow:0 2px 8px rgba(40,25,65,.025)
}
.google-svg{width:22px;height:22px;display:block}
.divider{display:flex;align-items:center;gap:16px;color:#aaa3b2;margin:21px 0}
.divider:before,.divider:after{content:"";height:1px;background:#ece8ef;flex:1}
.phone-row{
  height:58px;display:flex;background:#fff;border:1px solid var(--line);
  border-radius:17px;overflow:hidden;transition:.18s
}
.phone-row:focus-within{border-color:#b69cff;box-shadow:0 0 0 3px rgba(117,70,255,.08)}
.country{
  width:88px;border:0;border-right:1px solid var(--line);background:#fff;
  font-weight:700;padding:0 12px;outline:0;appearance:none
}
.phone-input{flex:1;border:0;outline:0;padding:0 17px;font-size:16px;color:var(--text);min-width:0}
.phone-input::placeholder{color:#b1abb8}
.hint{font-size:13px;color:#8e8897;margin:9px 2px 19px;line-height:1.5}
.verify{
  width:100%;height:58px;border:0;border-radius:17px;color:#fff;font-size:17px;font-weight:750;
  background:linear-gradient(100deg,#754cff 0%,#9c61ff 48%,#ed79a7 100%);
  box-shadow:0 9px 20px rgba(130,73,220,.18);transition:.18s
}
.verify:active,.primary-small:active{transform:translateY(1px)}
.guest-card{
  margin-top:27px;padding:17px 16px;border-radius:20px;background:#faf8fc;
  display:flex;gap:13px;align-items:flex-start
}
.guest-badge{
  width:39px;height:39px;border-radius:50%;background:#fff;color:var(--purple);
  display:grid;place-items:center;flex:none;font-size:19px;box-shadow:0 2px 8px rgba(50,30,90,.04)
}
.guest-card b{font-size:15px}.guest-card p{margin:6px 0 0;color:#80798b;font-size:13px;line-height:1.65}
.footer{text-align:center;margin:28px 0 24px;font-size:15px;color:var(--text)}
.footer .link{font-size:15px}
.guest-screen{text-align:center;padding:43px 12px 0}
.guest-symbol{
  width:70px;height:70px;border-radius:22px;margin:0 auto 20px;
  display:grid;place-items:center;background:#f1ebff;color:var(--purple);font-size:30px
}
.guest-screen h2{margin:0 0 10px;font-size:27px;letter-spacing:-.5px}
.guest-screen p{margin:0 auto 25px;max-width:305px;color:var(--muted);font-size:15px;line-height:1.75}
.primary{
  border:0;border-radius:17px;padding:15px 27px;color:#fff;font-weight:750;font-size:17px;
  background:linear-gradient(100deg,#754cff,#ed79a7);box-shadow:0 9px 20px rgba(130,73,220,.16)
}
.secondary{
  margin-top:12px;border:1px solid var(--line);border-radius:17px;padding:14px 27px;
  color:var(--text);font-weight:650;background:#fff
}
.hidden{display:none!important}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  padding:11px 16px;background:#171522;color:#fff;border-radius:13px;font-size:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);z-index:20;animation:fade .18s ease
}
@keyframes fade{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(22,18,30,.32);display:grid;place-items:end center;z-index:10
}
.modal{
  width:min(100%,430px);background:#fff;border-radius:25px 25px 0 0;padding:19px 22px 30px;
  box-shadow:0 -10px 35px rgba(20,10,40,.12)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.modal-head b{font-size:18px}.close{border:0;background:#f4f1f6;border-radius:50%;width:32px;height:32px}
.country-option{
  width:100%;border:0;border-bottom:1px solid #eee;background:#fff;padding:15px 3px;
  display:flex;justify-content:space-between;text-align:left
}
.country-option:last-child{border-bottom:0}
@media(max-height:760px){
  .brand{padding:22px 0 24px}.logo{width:76px;height:76px}.logo svg{width:60px;height:60px}
  .brand h1{font-size:44px;margin-top:14px}.saved{padding:13px}.avatar{width:52px;height:52px}
  .panel{padding-top:20px}
}
</style>
</head>
<body>
<main class="app">
  <header class="status">
    <span>19:37 ◐</span>
    <span class="status-icons"><span>▮▮▮</span><span>⌁</span><span>🔋</span></span>
  </header>

  <section class="brand">
    <div class="logo" aria-label="Proxy logo">
      <svg viewBox="0 0 100 100" role="img">
        <ellipse cx="50" cy="54" rx="34" ry="28" fill="#fff"/>
        <circle cx="27" cy="38" r="10" fill="#fff"/><circle cx="73" cy="38" r="10" fill="#fff"/>
        <circle cx="37" cy="53" r="4.2" fill="#171522"/><circle cx="63" cy="53" r="4.2" fill="#171522"/>
        <circle cx="38" cy="52" r="1.4" fill="#fff"/><circle cx="64" cy="52" r="1.4" fill="#fff"/>
        <path d="M43 64 Q50 57 57 64 Q50 72 43 64Z" fill="#171522"/>
        <path d="M50 68 Q50 76 44 78 M50 68 Q50 76 56 78" stroke="#171522" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M25 62 L8 58 M25 68 L8 69 M75 62 L92 58 M75 68 L92 69" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Proxy</h1>
  </section>

  <section class="saved">
    <div class="avatar">W</div>
    <div class="saved-info">
      <div class="saved-title">继续使用</div>
      <div class="saved-email">we••••@gmail.com</div>
    </div>
    <div class="saved-actions">
      <button class="primary-small" onclick="toast('正在继续使用该账号…')">继续</button>
      <button class="link" onclick="openAccounts()">换号</button>
    </div>
  </section>

  <nav class="tabs" aria-label="登录方式">
    <button class="tab active" data-tab="login">登录</button>
    <button class="tab" data-tab="register">注册</button>
    <button class="tab" data-tab="guest">♙ 访客模式</button>
  </nav>

  <section id="login" class="panel">
    <p class="label">登录方式</p>
    <button class="oauth" onclick="toast('Google 登录（原型）')">
      <svg class="google-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.7 2.92-4.2 2.92-7.19z"/>
        <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.51A9.75 9.75 0 0 0 12 21.75z"/>
        <path fill="#FBBC05" d="M6.54 13.85A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.85V7.64H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.36l3.24-2.51z"/>
        <path fill="#EA4335" d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.15 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.39l3.24 2.51c.77-2.31 2.92-4.03 5.46-4.03z"/>
      </svg>
      使用 Google 邮箱登录
    </button>

    <div class="divider"><span>或</span></div>

    <div class="phone-row">
      <button class="country" onclick="openCountries()">+84⌄</button>
      <input id="loginPhone" class="phone-input" placeholder="请输入手机号" inputmode="tel" autocomplete="tel">
    </div>
    <div class="hint">支持越南手机号（09...） / +84... / 0084...</div>
    <button id="loginVerify" class="verify" onclick="sendCode('login')">获取验证码</button>

    <div class="guest-card">
      <div class="guest-badge">♙</div>
      <div>
        <b>访客模式</b>
        <p>无需登录即可体验 Proxy。需要发布、交易或长期保存时，再升级登录。</p>
      </div>
    </div>
    <div class="footer">没有账号？ <button class="link" onclick="activate('register')">去注册　›</button></div>
  </section>

  <section id="register" class="panel hidden">
    <p class="label">创建账号</p>
    <button class="oauth" onclick="toast('Google 注册（原型）')">
      <svg class="google-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.7 2.92-4.2 2.92-7.19z"/>
        <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.51A9.75 9.75 0 0 0 12 21.75z"/>
        <path fill="#FBBC05" d="M6.54 13.85A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.85V7.64H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.36l3.24-2.51z"/>
        <path fill="#EA4335" d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.15 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.39l3.24 2.51c.77-2.31 2.92-4.03 5.46-4.03z"/>
      </svg>
      使用 Google 邮箱注册
    </button>
    <div class="divider"><span>或</span></div>
    <div class="phone-row">
      <button class="country" onclick="openCountries()">+84⌄</button>
      <input class="phone-input" placeholder="请输入手机号" inputmode="tel" autocomplete="tel">
    </div>
    <div class="hint">注册后可保存资料、发布内容并使用完整功能。</div>
    <button id="registerVerify" class="verify" onclick="sendCode('register')">获取验证码</button>
    <div class="footer">已有账号？ <button class="link" onclick="activate('login')">返回登录　›</button></div>
  </section>

  <section id="guest" class="guest-screen hidden">
    <div class="guest-symbol">♙</div>
    <h2>进入访客模式</h2>
    <p>无需注册或登录即可开始使用 Proxy。访客数据仅保存在当前设备。</p>
    <button class="primary" onclick="toast('已进入访客模式（原型）')">继续使用 Proxy</button>
    <br>
    <button class="secondary" onclick="activate('login')">返回登录</button>
  </section>
</main>

<div id="modalRoot" class="hidden"></div>

<script>
const tabs=[...document.querySelectorAll('.tab')];
const sections=['login','register','guest'];
tabs.forEach(t=>t.addEventListener('click',()=>activate(t.dataset.tab)));

function activate(name){
  tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  sections.forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==name));
  window.scrollTo({top:0,behavior:'smooth'});
}

function toast(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1700);
}

function sendCode(type){
  const input=document.querySelector(type==='login'?'#loginPhone':'#register .phone-input');
  const value=input?.value.trim()||'';
  if(value.length<8){toast('请输入有效的越南手机号');input?.focus();return}
  const btn=document.getElementById(type==='login'?'loginVerify':'registerVerify');
  let left=60;btn.disabled=true;btn.textContent=`重新获取 ${left}s`;
  const timer=setInterval(()=>{left--;btn.textContent=left?`重新获取 ${left}s`:'获取验证码';if(!left){clearInterval(timer);btn.disabled=false}},1000);
  toast('验证码已发送（原型）');
}

function openCountries(){
  const root=document.getElementById('modalRoot');
  root.className='modal-backdrop';
  root.innerHTML=`<div class="modal">
    <div class="modal-head"><b>选择国家/地区</b><button class="close" onclick="closeModal()">×</button></div>
    <button class="country-option" onclick="selectCountry('+84');closeModal()"><span>🇻🇳 越南</span><b>+84</b></button>
    <button class="country-option" onclick="selectCountry('+86');closeModal()"><span>🇨🇳 中国</span><b>+86</b></button>
    <button class="country-option" onclick="selectCountry('+1');closeModal()"><span>🇺🇸 美国</span><b>+1</b></button>
  </div>`;
  root.onclick=e=>{if(e.target===root)closeModal()};
}
function selectCountry(code){document.querySelectorAll('.country').forEach(b=>b.textContent=code+'⌄');toast('已切换国家/地区')}
function closeModal(){const root=document.getElementById('modalRoot');root.className='hidden';root.innerHTML=''}
function openAccounts(){
  const root=document.getElementById('modalRoot');root.className='modal-backdrop';
  root.innerHTML=`<div class="modal">
    <div class="modal-head"><b>切换账号</b><button class="close" onclick="closeModal()">×</button></div>
    <button class="country-option" onclick="toast('已选择 we••••@gmail.com');closeModal()"><span>W　we••••@gmail.com</span><b>›</b></button>
    <button class="country-option" onclick="closeModal();activate('login')"><span>＋　使用其他账号</span><b>›</b></button>
  </div>`;
  root.onclick=e=>{if(e.target===root)closeModal()};
}
</script>
</body>
</html>
