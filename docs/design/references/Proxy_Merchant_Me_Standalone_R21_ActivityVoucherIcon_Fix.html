.voucherList{display:grid;gap:10px}
.voucherCard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:none;cursor:pointer}
.voucherCardTop{display:flex;align-items:center;gap:12px}

.voucherMain{flex:1;min-width:0}
.voucherKind{display:block;font-size:11px;line-height:15px;font-weight:700;color:var(--muted)}
.voucherAmount{display:block;font-size:20px;line-height:24px;font-weight:900;color:var(--ink);margin-top:2px;letter-spacing:-.015em}
.voucherExpiry{flex:none;text-align:right}

.voucherExpiry span{display:block;font-size:11px;line-height:15px;font-weight:600;color:var(--muted);margin-top:2px}
.voucherCardBottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.voucherCardBottom div{min-width:0}
.voucherCardBottom b{display:block;font-size:14px;line-height:20px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voucherCardBottom span{display:block;font-size:12px;line-height:17px;font-weight:500;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voucherCardBottom em{font-style:normal;font-size:22px;color:var(--muted)}
