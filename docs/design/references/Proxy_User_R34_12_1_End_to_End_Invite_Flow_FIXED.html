<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" name="viewport"/>
<title>Proxy · 4-Grid Composer</title>
<style>
:root{
  --bg:#f7f4ef;
  --paper:#fff;
  --ink:#151515;
  --muted:#8c877f;
  --line:#e8e2da;
  --accent:#f3b33a;
  --safe-bottom:max(10px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#ddd7cf;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
button{font:inherit}
.stage{min-height:100vh;display:flex;justify-content:center;padding:18px}
.phone{width:390px;height:844px;background:var(--bg);border:1px solid #bdb5ab;border-radius:34px;overflow:hidden;position:relative}
.status{height:36px;padding:8px 16px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:750}
.screen{position:absolute;inset:36px 0 76px 0;overflow:auto;padding:0 14px 18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 10px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:38px;height:38px;border-radius:11px;background:#111;display:grid;place-items:center;color:#fff;font-size:21px}
.brand b{font-size:21px;letter-spacing:-.5px}
.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.search{height:46px;border:1px solid var(--line);background:#fff;border-radius:24px;display:flex;align-items:center;gap:7px;padding:0 7px 0 13px;margin-bottom:12px}
.searchText{flex:1;color:#aaa59e;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search button{width:34px;height:34px;border:0;border-radius:50%;background:#f6f3ee;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{height:217px;border:0;border-radius:22px;overflow:hidden;position:relative;padding:0;background:#ccc;isolation:isolate}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,0) 45%,rgba(0,0,0,.42));z-index:1}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:.18s ease}
.tile:active img{transform:scale(.985)}
.tileLabel{position:absolute;left:11px;bottom:11px;z-index:2;color:#fff;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;text-shadow:0 1px 5px rgba(0,0,0,.28)}
.tileLabel span:first-child{font-size:16px}
.change{position:absolute;right:9px;top:9px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#111;font-size:18px}
.cta{width:100%;height:52px;margin-top:12px;border:0;border-radius:26px;background:#171715;color:#fff;font-size:16px;font-weight:800;letter-spacing:.2px;display:flex;justify-content:center;align-items:center;gap:9px}
.cta i{font-style:normal;color:#ffd17d}
.bottom{position:absolute;left:0;right:0;bottom:0;height:76px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:9px;padding-bottom:var(--safe-bottom)}
.nav{border:0;background:transparent;color:#8b8780;text-align:center;min-width:54px}
.nav i{font-style:normal;display:block;font-size:18px;margin-bottom:4px}
.nav span{font-size:9px}
.nav.on{color:#111;font-weight:850}

.mask{position:absolute;inset:0;background:rgba(0,0,0,.20);display:none;z-index:20}
.mask.on{display:block}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:25px 25px 19px 19px;z-index:21;display:none;padding:8px 12px 16px}
.sheet.on{display:block}
.grab{width:34px;height:3px;border-radius:2px;background:#ded8d0;margin:0 auto 10px}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheetHead b{font-size:14px}
.close{border:0;background:transparent;font-size:19px;color:#8d8880}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.opt{border:1px solid var(--line);background:#fff;border-radius:17px;overflow:hidden;padding:0;text-align:left}
.opt.on{outline:2px solid #111}
.optImg{height:88px;background:#ddd}
.optImg img{width:100%;height:100%;object-fit:cover;display:block}
.optText{padding:8px}
.optText b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.optText span{display:block;font-size:9px;color:#98938b;margin-top:2px}
.timeOpt{height:128px;display:flex;flex-direction:column;justify-content:flex-end;padding:11px;background-size:cover;background-position:center;position:relative}
.timeOpt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.timeOpt b,.timeOpt span{position:relative;z-index:1;color:#fff}
.timeOpt b{font-size:14px}
.timeOpt span{font-size:9px;margin-top:3px}

.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 11px;border-radius:999px;font-size:10px;z-index:30;display:none;white-space:nowrap}
.toast.on{display:block}

@media(max-width:430px){
  .stage{padding:0}
  .phone{width:100vw;height:100vh;border:0;border-radius:0}
}

/* R34.10 invite / poster / link */
.actionMask,.posterMask{
  position:absolute; inset:0; background:rgba(0,0,0,.22);
  display:none; z-index:24;
}
.actionMask.on,.posterMask.on{display:block}
.actionSheet{
  position:absolute; left:8px; right:8px; bottom:8px; z-index:25;
  background:#fff; border:1px solid var(--line); border-radius:25px 25px 19px 19px;
  padding:8px 12px 16px; display:none;
}
.actionSheet.on{display:block}
.actionHead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.actionHead b{font-size:14px}
.actionRows{display:grid; gap:8px}
.actionBtn{
  height:48px; border:1px solid var(--line); background:#fff; border-radius:16px;
  display:flex; align-items:center; justify-content:space-between; padding:0 14px;
  font-size:13px; font-weight:700;
}
.actionBtn small{font-size:10px; color:#918b84; font-weight:600}
.posterLayer{
  position:absolute; inset:0; z-index:26; background:var(--bg); display:none;
}
.posterLayer.on{display:block}
.posterTop{
  height:52px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center;
  background:#fff; border-bottom:1px solid var(--line); padding:0 8px;
}
.posterTop button{border:0; background:transparent; font-size:20px}
.posterTop b{text-align:center; font-size:13px}
.posterScroll{
  position:absolute; inset:52px 0 0 0; overflow:auto; padding:14px 14px 20px;
}
.posterCard{
  background:#fff; border:1px solid var(--line); border-radius:26px; overflow:hidden;
  box-shadow:0 12px 28px rgba(28,26,23,.08);
}
.posterMedia{
  height:280px; position:relative; background:center/cover no-repeat;
}
.posterMedia::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.48));
}
.posterBadge{
  position:absolute; left:14px; top:14px; z-index:2;
  background:rgba(255,255,255,.92); border-radius:999px; padding:7px 10px;
  font-size:10px; font-weight:800;
}
.posterPerson{
  position:absolute; left:14px; right:14px; bottom:14px; z-index:2;
  display:flex; align-items:center; gap:10px;
}
.posterPerson .avatarLg{
  width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.95)
}
.posterPerson .avatarLg img{width:100%; height:100%; object-fit:cover}
.posterMeta{color:#fff}
.posterMeta b{display:block; font-size:20px; line-height:1.15}
.posterMeta span{display:block; font-size:11px; opacity:.95; margin-top:4px}
.posterBody{padding:14px}
.posterRow{
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;
}
.posterPill{
  background:#f5f1eb; border-radius:999px; padding:7px 10px;
  font-size:10px; font-weight:700;
}
.posterQuote{
  font-size:15px; line-height:1.45; font-weight:700; margin:0 0 12px 0;
}
.posterLink{
  border:1px dashed var(--line); background:#faf8f4; border-radius:16px;
  padding:12px; font-size:11px; color:#6f6a63; word-break:break-all;
}
.posterActions{
  display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;
}
.posterActions button,.singleWide{
  height:46px; border-radius:16px; border:0; font-size:13px; font-weight:800;
}
.primaryBtn{background:#171715; color:#fff}
.softBtn{background:#fff; color:#171715; border:1px solid var(--line)}
.singleWide{width:100%; margin-top:8px}

/* R34.11 · modern social share flow */
.cta{
  display:grid !important;
  grid-template-columns:1fr 1fr;
  gap:8px;
  height:auto !important;
  background:transparent !important;
  margin-top:12px;
}
.ctaAction{
  height:50px;
  border-radius:24px;
  border:1px solid var(--line);
  background:#fff;
  color:#171715;
  font-size:14px;
  font-weight:850;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}
.ctaAction.primary{
  background:#171715;
  color:#fff;
  border-color:#171715;
}
.ctaAction i{font-style:normal;color:#f4bb4e}
.quickShare{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:2px 0 4px;
}
.quickItem{
  border:0;
  background:transparent;
  text-align:center;
  padding:4px 0;
}
.quickIcon{
  width:52px;
  height:52px;
  border-radius:18px;
  margin:0 auto 7px;
  display:grid;
  place-items:center;
  background:#f5f2ed;
  font-size:21px;
}
.quickItem b{
  display:block;
  font-size:11px;
}
.generateLayer{
  position:absolute;
  inset:0;
  z-index:27;
  background:var(--bg);
  display:none;
}
.generateLayer.on{display:block}
.generateTop{
  height:52px;
  display:grid;
  grid-template-columns:44px 1fr 44px;
  align-items:center;
  padding:0 8px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.generateTop button{
  border:0;
  background:transparent;
  font-size:20px;
}
.generateTop b{
  text-align:center;
  font-size:13px;
}
.generateBody{
  position:absolute;
  inset:52px 0 0;
  overflow:auto;
  padding:14px;
}
.generatedPreview{
  width:100%;
  border-radius:24px;
  display:block;
  background:#ddd;
  border:1px solid var(--line);
}
.generatedActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.generatedActions button{
  height:46px;
  border-radius:17px;
  font-size:13px;
  font-weight:850;
}
.generatedActions .dark{
  border:0;
  background:#171715;
  color:#fff;
}
.generatedActions .light{
  border:1px solid var(--line);
  background:#fff;
  color:#171715;
}
.miniAction{
  width:100%;
  height:44px;
  margin-top:8px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  font-size:12px;
  font-weight:800;
}

/* R34.12 · End-to-end invite flow */
.receiveLayer,.careLayer{
  position:absolute; inset:0; z-index:40; background:var(--bg); display:none;
}
.receiveLayer.on,.careLayer.on{display:block}
.receiveTop,.careTopBar{
  height:52px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center;
  padding:0 8px; background:#fff; border-bottom:1px solid var(--line);
}
.receiveTop button,.careTopBar button{
  border:0; background:transparent; font-size:20px;
}
.receiveTop b,.careTopBar b{
  text-align:center; font-size:13px;
}
.receiveBody,.careBody{
  position:absolute; inset:52px 0 0; overflow:auto; padding:14px;
}
.receiveCard{
  background:#fff; border:1px solid var(--line); border-radius:24px; overflow:hidden;
}
.receiveScene{
  height:230px; background:center/cover no-repeat; position:relative;
}
.receiveScene:after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.42));
}
.receivePerson{
  position:absolute; left:12px; bottom:12px; z-index:2;
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,.94); border-radius:999px; padding:6px 9px 6px 6px;
}
.receivePerson img{
  width:38px; height:38px; border-radius:50%; object-fit:cover;
}
.receivePerson b{font-size:11px}
.receiveGrid{
  display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px;
}
.receiveCell{
  border:1px solid var(--line); border-radius:16px; padding:10px;
  background:#faf8f4; position:relative; min-height:68px;
}
.receiveCell label{
  display:block; font-size:8px; color:#99948d; margin-bottom:5px;
}
.receiveCell b{
  display:block; font-size:11px; line-height:1.3; padding-right:24px;
}
.receiveCell .editOne{
  position:absolute; right:7px; top:7px; width:24px; height:24px;
  border:0; border-radius:50%; background:#fff; font-size:13px;
}
.receiveActions{
  display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
}
.receiveActions button{
  height:48px; border-radius:17px; font-size:13px; font-weight:850;
}
.acceptBtn{
  border:0; background:#171715; color:#fff;
}
.changeBtn{
  border:1px solid var(--line); background:#fff; color:#171715;
}
.rejectBtn{
  width:100%; height:42px; margin-top:8px; border:0; background:transparent;
  color:#8b867f; font-size:11px;
}
.confirmState{
  background:#fff; border:1px solid var(--line); border-radius:24px; padding:18px; text-align:center;
}
.confirmAvatar{
  width:78px; height:78px; border-radius:50%; overflow:hidden; margin:0 auto 10px;
}
.confirmAvatar img{width:100%; height:100%; object-fit:cover}
.confirmState h2{font-size:19px; margin:0}
.confirmState p{font-size:10px; color:#817c74; line-height:1.45}
.statePill{
  display:inline-block; margin-top:5px; padding:6px 9px; border-radius:999px;
  background:#eaf8f1; color:#187653; font-size:9px; font-weight:850;
}
.careCard2{
  background:#fff; border:1px solid var(--line); border-radius:22px; padding:12px; margin-top:10px;
}
.careHeader2{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
}
.careHeader2 b{font-size:12px}
.careReady{font-size:9px; color:#187653; font-weight:850}
.careLine2{
  display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:10px;
}
.careLine2 span{color:#817d76}
.arriveScene{
  background:#fff; border:1px solid var(--line); border-radius:22px; overflow:hidden; margin-top:10px;
}
.arriveScene img{width:100%; height:170px; object-fit:cover; display:block}
.arriveScene .copy{padding:11px}
.arriveScene b{font-size:12px}
.arriveScene span{display:block; font-size:9px; color:#868179; margin-top:3px}
.demoNext{
  margin-top:10px; width:100%; height:46px; border:0; border-radius:17px;
  background:#171715; color:#fff; font-size:13px; font-weight:850;
}
.demoSoft{
  margin-top:8px; width:100%; height:42px; border:1px solid var(--line); border-radius:17px;
  background:#fff; color:#171715; font-size:12px; font-weight:800;
}
</style>
</head>

function openReplaceSheet(type){
  activeType = type;

  $('sheetBody').innerHTML = `

            ? ''

          }

}

function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const im = new Image();
    im.onload = ()=>resolve(im);
    im.onerror = reject;
    im.src = src;
  });
}

async function drawCover(ctx,img,x,y,w,h,r=0){
  const ir=img.width/img.height, rr=w/h;
  let sx=0, sy=0, sw=img.width, sh=img.height;
  if(ir>rr){ sw=img.height*rr; sx=(img.width-sw)/2; }
  else{ sh=img.width/rr; sy=(img.height-sh)/2; }

  ctx.save();
  if(r){ roundedRect(ctx,x,y,w,h,r); ctx.clip(); }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  ctx.restore();
}

async function generateMomentImage(){
  const canvas=$('momentCanvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f6f1e9';
  ctx.fillRect(0,0,W,H);

  const [p,s] = await Promise.all([
    loadImage(state.person.img),
    loadImage(state.scene.img)
  ]);

  await drawCover(ctx,s,60,60,960,780,52);

  const grad=ctx.createLinearGradient(0,380,0,840);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,.48)');
  ctx.fillStyle=grad;
  roundedRect(ctx,60,60,960,780,52);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(150,715,76,0,Math.PI*2);
  ctx.clip();
  ctx.drawImage(p,74,639,152,152);
  ctx.restore();

  ctx.lineWidth=8;
  ctx.strokeStyle='rgba(255,255,255,.96)';
  ctx.beginPath();
  ctx.arc(150,715,76,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle='#fff';
  ctx.font='700 50px Arial';
  ctx.fillText(state.scene.label,260,690);
  ctx.font='500 30px Arial';
  ctx.fillText(`${state.person.label} · ${state.time.label}`,260,742);

  const items=[
    ['人',state.person.label],
    ['时',state.time.label],
    ['动',state.activity.label],
    ['景',state.scene.label]
  ];
  const startX=70,y=910,gap=20,boxW=220,boxH=170;
  items.forEach((item,i)=>{
    const x=startX+i*(boxW+gap);
    ctx.fillStyle='#fff';
    roundedRect(ctx,x,y,boxW,boxH,34);
    ctx.fill();
    ctx.fillStyle='#9a948c';
    ctx.font='600 26px Arial';
    ctx.fillText(item[0],x+24,y+42);
    ctx.fillStyle='#171715';
    ctx.font='700 30px Arial';
    const t=item[1].length>8?item[1].slice(0,8)+'…':item[1];
    ctx.fillText(t,x+24,y+105);
  });

  ctx.fillStyle='#171715';
  ctx.font='800 42px Arial';
  ctx.fillText('Proxy',70,1205);

  const data = canvas.toDataURL('image/jpeg',0.92);
  $('generatedImage').src = data;
  return data;
}

        <div class="copy"><b>${state.activity.label}</b><span>${state.time.label}</span></div>
      </div>
      <button class="demoNext" id="arriveBtn">到场</button>
      <button class="demoSoft" id="careHome">返回 Home</button>
    `;
    $('arriveBtn').onclick=()=>{
      careStep='arrived';
      renderCare();
    };
    $('careHome').onclick=closeCare;
    return;
  }

  $('careTitle').textContent='Moment';
  body.innerHTML=`
    <div class="confirmState">
      <div class="confirmAvatar"><img src="${state.person.img}" alt="${state.person.label}"></div>
      <h2>已发生</h2>
      <p>${state.time.label} · ${state.activity.label} · ${state.scene.label}</p>
      <span class="statePill">MOMENT</span>
    </div>
    <div class="arriveScene">
      <img src="${state.scene.img}" alt="${state.scene.label}">
      <div class="copy"><b>${state.scene.label}</b><span>Scene Memory</span></div>
    </div>
    <button class="demoNext" id="doneHome">完成</button>
  `;
  $('doneHome').onclick=()=>{
    closeCare();
    toast('已保存');
  };
}

function bindStaticEvents(){
  document.querySelectorAll('.tile').forEach(tile=>{
    tile.addEventListener('click', ()=>openReplaceSheet(tile.dataset.type));
  });

  $('mask').onclick=closeReplaceSheet;
  $('sheetClose').onclick=closeReplaceSheet;

  $('photoBtn').onclick=()=>toast('图片输入');
  $('voiceBtn').onclick=()=>toast('语音输入');

  $('generateBtn').onclick=openGenerated;
  $('sendBtn').onclick=openSendSheet;

  $('actionMask').onclick=closeSendSheet;
  $('actionClose').onclick=closeSendSheet;

  $('directInviteBtn').onclick=openReceiver;
  $('cardInviteBtn').onclick=openGenerated;
  $('copyLinkBtn').onclick=()=>copyText(buildInviteLink());

  $('generateBack').onclick=closeGenerated;
  $('generatedCopyBtn').onclick=()=>copyText(buildInviteLink());

  $('shareGeneratedBtn').onclick=async()=>{
    const link=buildInviteLink();
    if(navigator.share){
      try{
        await navigator.share({
          title:'Proxy',
          text:`${state.time.label} · ${state.activity.label} · ${state.scene.label}`,
          url:link
        });
      }catch(e){}
    }else{
      await copyText(link,'已发出');
    }
    setTimeout(openReceiver,150);
  };

  $('saveGeneratedBtn').onclick=()=>{
    const src=$('generatedImage').src;
    if(!src){ toast('还没有图片'); return; }
    const a=document.createElement('a');
    a.href=src;
    a.download='Proxy-Moment.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已保存');
  };

  $('receiveBack').onclick=closeReceiver;
  $('careBack').onclick=closeCare;
}

async function smokeTest(){
  try{
    document.querySelector('[data-type="time"]').click();
    if(!$('sheet').classList.contains('on')) throw new Error('replace');
    closeReplaceSheet();

    $('sendBtn').click();
    if(!$('actionSheet').classList.contains('on')) throw new Error('send');

    $('directInviteBtn').click();
    if(!$('receiveLayer').classList.contains('on')) throw new Error('receiver');

    $('acceptInvite').click();
    if(!$('enterCare')) throw new Error('accept');

    $('enterCare').click();
    if(!$('careLayer').classList.contains('on')) throw new Error('care');

    $('arriveBtn').click();
    if(!$('doneHome')) throw new Error('arrive');

    document.body.dataset.smoke='PASS';
    document.title='PASS';
  }catch(e){
    document.body.dataset.smoke='FAIL';
    document.body.dataset.smokeError=e.message;
    document.title='FAIL';
  }
}

renderHome();
bindStaticEvents();
if(location.hash==='#smoketest'){
  setTimeout(smokeTest,80);
}
</script>
</body>
</html>
