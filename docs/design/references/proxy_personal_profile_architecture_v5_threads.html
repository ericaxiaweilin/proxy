<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proxy · 个人主页 v5 · Threads Direction</title>
<style>
:root{
  --bg:#fff;--text:#0a0a0a;--muted:#777;--line:#e8e8e8;--soft:#f5f5f5;
  --lime:#c9ff08;--danger:#e5484d;
}
*{box-sizing:border-box}
html,body{margin:0;background:#efefef;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #111;outline-offset:2px}
.app{width:min(430px,100%);min-height:100vh;margin:auto;background:var(--bg)}
.status{height:44px;padding:12px 18px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:650}
.topbar{height:48px;padding:0 14px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);z-index:20}
.icon-btn{width:38px;height:38px;border:0;background:transparent;border-radius:50%;font-size:21px;display:grid;place-items:center}
.top-title{text-align:center;font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prototype-view{border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
.prototype-view b{color:#111;font-weight:650}.prototype-view select{margin-left:auto;border:0;background:var(--soft);border-radius:999px;padding:7px 26px 7px 10px;font-size:11px}
.profile{padding:20px 18px 15px}
.profile-head{display:grid;grid-template-columns:1fr 78px;gap:16px;align-items:start}
.display-name{font-size:22px;font-weight:720;letter-spacing:-.35px;line-height:1.12;margin-top:2px}
.handle-row{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:13px}
.handle{color:#333}.verified{width:16px;height:16px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size: 11px;font-weight:800}
.avatar{width:76px;height:76px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:720;justify-self:end;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.bio{font-size:14px;line-height:1.48;margin-top:14px;max-width:370px}
.profile-meta{margin-top:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{width:2px;height:2px;border-radius:50%;background:#aaa}.availability{display:inline-flex;align-items:center;gap:5px;color:#111}.availability::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1px #b8e900 inset}
.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.profile-actions.owner{grid-template-columns:1fr 1fr}
.action{height:38px;border:1px solid #d7d7d7;background:#fff;border-radius:10px;font-size:13px;font-weight:650}.action.primary{background:#111;color:#fff;border-color:#111}.action.lime{background:var(--lime);border-color:var(--lime);color:#111}
.tabs{height:47px;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);position:sticky;top:48px;background:#fff;z-index:18}
.tab{position:relative;border:0;background:#fff;color:#8a8a8a;font-size:13px;font-weight:560}.tab.active{color:#111}.tab.active::after{content:"";position:absolute;left:16%;right:16%;bottom:-1px;height:1.5px;background:#111}
.pager{overflow:hidden;touch-action:pan-y}.track{display:flex;width:300%;transform:translateX(0);transition:transform .24s cubic-bezier(.2,.75,.3,1);will-change:transform}.track.dragging{transition:none}.page{width:33.333333%;min-width:33.333333%;align-self:flex-start;background:#fff;min-height:420px}
.feed{width:100%}.post{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.post-head{display:grid;grid-template-columns:38px 1fr 32px;gap:10px;align-items:start}.mini-avatar{width:38px;height:38px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}.post-name-line{display:flex;gap:6px;align-items:center;min-width:0}.post-name{font-size:13px;font-weight:680}.post-time{font-size:11px;color:var(--muted);white-space:nowrap}.post-menu{border:0;background:transparent;font-size:19px;line-height:1;padding:0;height:28px;color:#555}.post-body{padding-left:48px;margin-top:-12px}.post-text{font-size:14px;line-height:1.48;white-space:pre-wrap}.scene-line{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11px;color:#666}.scene-chip{border:1px solid #ddd;border-radius:999px;padding:4px 8px;color:#111;background:#fff}.post-media{display:grid;gap:2px;margin-top:11px;border-radius:12px;overflow:hidden;background:#f2f2f2}.post-media.one{grid-template-columns:1fr}.post-media.two{grid-template-columns:1fr 1fr}.post-media.three{grid-template-columns:1fr 1fr;grid-template-rows:138px 138px}.post-media.three .media-cell:first-child{grid-row:1/3}.post-media.four{grid-template-columns:1fr 1fr;grid-template-rows:138px 138px}.media-cell{border:0;padding:0;background:#eee;min-height:190px;overflow:hidden;position:relative}.post-media.two .media-cell{min-height:210px}.post-media.three .media-cell,.post-media.four .media-cell{min-height:0}.media-cell img{width:100%;height:100%;object-fit:cover;display:block}.more-media{position:absolute;inset:0;background:rgba(0,0,0,.34);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:650}
.post-actions{display:flex;gap:20px;margin-top:12px;font-size:12px;color:#666}.post-actions button{border:0;background:transparent;padding:0;color:inherit;font-size:12px}.owner-menu{display:flex;gap:10px;margin-top:10px}.owner-menu button{border:0;background:transparent;padding:0;font-size:11px;color:var(--muted)}.owner-menu .danger{color:var(--danger)}
.compose{padding:14px 18px;border-bottom:1px solid var(--line);display:none;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}.compose.show{display:grid}.compose-placeholder{border:0;background:transparent;color:#888;text-align:left;padding:7px 0;font-size:13px}.compose-add{border:0;background:#111;color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:650}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#fff;padding:1px}.media-grid button{aspect-ratio:1;border:0;padding:0;background:#eee;overflow:hidden;position:relative}.media-grid img{width:100%;height:100%;object-fit:cover;display:block}.media-private{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:3px 5px;font-size: 11px}.empty{padding:58px 32px;text-align:center;color:#777}.empty b{display:block;color:#111;font-size:16px;margin-bottom:7px}.empty span{font-size:12px;line-height:1.5}
.record{padding:15px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center}.record-icon{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;font-weight:700}.record b{font-size:13px;font-weight:650}.record span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.record strong{font-size:12px;font-weight:650}
.fab{position:fixed;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:calc(22px + env(safe-area-inset-bottom));width:52px;height:52px;border:0;border-radius:50%;background:#111;color:#fff;font-size:27px;font-weight:300;display:none;place-items:center;z-index:25}.fab.show{display:grid}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;z-index:80}.mask.show{display:flex}.sheet{width:min(430px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:15px 18px calc(18px + env(safe-area-inset-bottom))}.sheet-handle{width:36px;height:4px;border-radius:999px;background:#d6d6d6;margin:0 auto 15px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet-title{font-size:16px;font-weight:700}.close{border:0;background:transparent;font-size:22px;width:34px;height:34px}.field{margin-top:14px}.field label{display:block;font-size:11px;color:#777;margin-bottom:6px}.input,.textarea,.select{width:100%;border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 11px;font-size:13px}.textarea{height:110px;resize:none}.sheet-actions{display:flex;gap:8px;margin-top:18px}.sheet-actions button{flex:1;height:42px;border-radius:10px;font-weight:650}.cancel{border:1px solid #ddd;background:#fff}.save{border:0;background:#111;color:#fff}.danger-btn{border:1px solid #ffd2d2;background:#fff;color:var(--danger)}
.upload-row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.upload-thumb{width:78px;height:78px;flex:0 0 auto;border-radius:9px;overflow:hidden;background:#eee;position:relative}.upload-thumb img{width:100%;height:100%;object-fit:cover}.upload-thumb button{position:absolute;right:3px;top:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.68);color:#fff}.upload-add{width:78px;height:78px;flex:0 0 auto;border:1px dashed #bbb;border-radius:9px;background:#fafafa;display:grid;place-items:center;font-size:24px;color:#777}
.viewer{position:fixed;inset:0;background:#050505;color:#fff;display:none;z-index:100;touch-action:pan-y}.viewer.show{display:block}.viewer-top{position:absolute;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;justify-content:space-between;align-items:center;z-index:2;background:linear-gradient(rgba(0,0,0,.55),transparent)}.viewer-top button{border:0;background:transparent;color:#fff;font-size:25px}.viewer-stage{height:100%;display:grid;place-items:center}.viewer-stage img{width:100%;max-height:100%;object-fit:contain}.viewer-caption{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));font-size:12px;line-height:1.45;color:#eee}.viewer-counter{font-size:12px}.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:24px}.viewer-prev{left:10px}.viewer-next{right:10px}
@media(min-width:431px){body{padding:20px 0}.app{border:1px solid #ddd;min-height:900px}.sheet{border-radius:18px}.status{display:none}.topbar{top:0}.tabs{top:48px}}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>20:21</span><span>● ● ●</span></div>
  <header class="topbar">
    <button class="icon-btn" aria-label="返回">‹</button>
    <div class="top-title">huyen</div>
    <button class="icon-btn" aria-label="更多">⋯</button>
  </header>

  <div class="prototype-view">
    <b>原型视角</b><span>用于验证关系权限，不属于正式主页 UI</span>
    <select id="viewSelect" aria-label="视角">
      <option value="stranger">陌生人</option>
      <option value="friend">好友</option>
      <option value="merchant">商家</option>
      <option value="customer">已成交</option>
      <option value="owner">本人</option>
    </select>
  </div>

  <section class="profile">
    <div class="profile-head">
      <div>
        <div class="display-name" id="displayName">Huyen</div>
        <div class="handle-row"><span class="handle" id="handle">@huyen</span><span class="verified">✓</span></div>
      </div>
      <div class="avatar" id="avatar">H</div>
    </div>
    <div class="bio" id="bio">熟悉河内旅行与消费场景。喜欢旅行、拍照，也可以帮忙做中越沟通。</div>
    <div class="profile-meta">
      <span id="city">河内</span><span class="dot"></span><span>42 次已履约</span><span class="dot"></span><span class="availability">可接单</span>
    </div>
    <div class="profile-actions" id="profileActions">
      <button class="action primary" id="action1">加好友</button>
      <button class="action lime" id="action2">发起需求</button>
    </div>
  </section>

  <nav class="tabs" aria-label="个人主页分页">
    <button class="tab active" data-page="0">动态</button>
    <button class="tab" data-page="1">照片</button>
    <button class="tab" data-page="2">记录</button>
  </nav>

  <div class="pager" id="pager">
    <div class="track" id="track">
      <section class="page" id="feedPage">
        <div class="compose" id="compose"><div class="mini-avatar">H</div><button class="compose-placeholder" onclick="openComposer()">分享一点近况...</button><button class="compose-add" onclick="openComposer()">发布</button></div>
        <div class="feed" id="feed"></div>
      </section>
      <section class="page" id="mediaPage"><div class="media-grid" id="mediaGrid"></div></section>
      <section class="page" id="recordPage"><div id="records"></div></section>
    </div>
  </div>
</div>
<button class="fab" id="fab" onclick="openComposer()" aria-label="发布">＋</button>

<div class="mask" id="composerMask" onclick="if(event.target===this)closeComposer()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title" id="composerTitle">发布动态</div><button class="close" onclick="closeComposer()">×</button></div>
    <div class="field"><label>内容</label><textarea class="textarea" id="postText" placeholder="说点什么，也可以只发照片"></textarea></div>
    <div class="field"><label>照片</label><div class="upload-row" id="uploadRow"></div><input id="fileInput" type="file" accept="image/*" multiple hidden onchange="handleFiles(event)"></div>
    <div class="field"><label>场景（可选）</label><select class="select" id="postScene"><option value="">普通动态</option><option>同行</option><option>翻译</option><option>旅行</option><option>消费</option><option>体验</option></select></div>
    <div class="field"><label>位置（可选）</label><input class="input" id="postLocation" placeholder="例如：河内 · 西湖"></div>
    <div class="field"><label>谁可以看</label><select class="select" id="postVisibility"><option value="public">所有人</option><option value="friends">好友</option><option value="private">仅自己</option></select></div>
    <div class="sheet-actions"><button class="cancel" onclick="closeComposer()">取消</button><button class="save" onclick="savePost()">发布</button></div>
  </div>
</div>

<div class="mask" id="profileMask" onclick="if(event.target===this)closeProfileEditor()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">编辑主页</div><button class="close" onclick="closeProfileEditor()">×</button></div>
    <div class="field"><label>显示名称</label><input class="input" id="editName"></div>
    <div class="field"><label>用户名</label><input class="input" id="editHandle"></div>
    <div class="field"><label>一句话介绍</label><textarea class="textarea" id="editBio"></textarea></div>
    <div class="field"><label>城市</label><input class="input" id="editCity"></div>
    <div class="sheet-actions"><button class="cancel" onclick="closeProfileEditor()">取消</button><button class="save" onclick="saveProfile()">保存</button></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="viewer-top"><button onclick="closeViewer()">×</button><span class="viewer-counter" id="viewerCounter"></span><span style="width:34px"></span></div>
  <button class="viewer-nav viewer-prev" onclick="viewerStep(-1)">‹</button>
  <div class="viewer-stage" id="viewerStage"><img id="viewerImage" alt="照片"></div>
  <button class="viewer-nav viewer-next" onclick="viewerStep(1)">›</button>
  <div class="viewer-caption" id="viewerCaption"></div>
</div>

<script>
const fallbackPosts=[
  {id:"t1",text:"今天去了西湖附近的小咖啡店，下午坐一会很舒服。",scene:"旅行",location:"河内 · 西湖",visibility:"public",createdAt:"2 小时",media:["https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=82","https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=82"]},
  {id:"t2",text:"周六想去宁平，一天往返。还有 1 个位置。",scene:"同行",location:"河内 → 宁平",visibility:"public",createdAt:"5 小时",media:["https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1000&q=82"]},
  {id:"t3",text:"海边的下午。",scene:"旅行",location:"岘港",visibility:"public",createdAt:"8月23日",media:["https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=82","https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=900&q=82","https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=82"]},
  {id:"t4",text:"最近在找几个适合游客、不会太吵的本地餐厅。",scene:"消费",location:"河内",visibility:"friends",createdAt:"8月21日",media:[]},
  {id:"t5",text:"这张只留给自己。",scene:"",location:"",visibility:"private",createdAt:"8月20日",media:["https://images.unsplash.com/photo-1500534314209-a25ddb2bd4297?auto=format&fit=crop&w=900&q=82"]}
];
const profileDefault={name:"Huyen",handle:"@huyen",bio:"熟悉河内旅行与消费场景。喜欢旅行、拍照，也可以帮忙做中越沟通。",city:"河内"};
const viewCfg={
  stranger:{a1:"加好友",a2:"发起需求"},friend:{a1:"发消息",a2:"一起计划"},merchant:{a1:"发消息",a2:"邀请合作"},customer:{a1:"发消息",a2:"再次下单"},owner:{a1:"编辑主页",a2:"分享主页"}
};
let currentView="stranger",currentPage=0,posts=load("proxy-threads-posts-v1",fallbackPosts),profile=load("proxy-threads-profile-v1",profileDefault),editingPostId=null,draftMedia=[];
let viewerItems=[],viewerIndex=0,viewerStartX=0;
let dragStartX=0,dragStartY=0,dragging=false,baseTranslate=0;

function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):JSON.parse(JSON.stringify(fallback))}catch(e){return JSON.parse(JSON.stringify(fallback))}}
function persist(){try{localStorage.setItem("proxy-threads-posts-v1",JSON.stringify(posts));localStorage.setItem("proxy-threads-profile-v1",JSON.stringify(profile))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function visiblePost(p){if(currentView==="owner")return true;if(p.visibility==="public")return true;if(currentView==="friend"&&p.visibility==="friends")return true;if(currentView==="customer"&&p.visibility==="friends")return true;return false}
function visibilityLabel(v){return v==="public"?"所有人":v==="friends"?"好友":"仅自己"}

function applyProfile(){displayName.textContent=profile.name;handle.textContent=profile.handle.startsWith("@")?profile.handle:"@"+profile.handle;bio.textContent=profile.bio;city.textContent=profile.city;avatar.textContent=(profile.name||"H").trim().charAt(0).toUpperCase();document.querySelectorAll(".mini-avatar").forEach(x=>x.textContent=(profile.name||"H").trim().charAt(0).toUpperCase());topTitle.textContent=(profile.handle||"@huyen").replace(/^@/,"")}
const topTitle=document.querySelector(".top-title");
function setView(v){currentView=v;viewSelect.value=v;const c=viewCfg[v];action1.textContent=c.a1;action2.textContent=c.a2;compose.classList.toggle("show",v==="owner");fab.classList.toggle("show",v==="owner");profileActions.classList.toggle("owner",v==="owner");renderAll()}
viewSelect.onchange=e=>setView(e.target.value);
action1.onclick=()=>{if(currentView==="owner")openProfileEditor()};

function renderAll(){applyProfile();renderFeed();renderMedia();renderRecords()}
function renderFeed(){const visible=posts.filter(visiblePost);feed.innerHTML=visible.length?visible.map(renderPost).join(""):'<div class="empty"><b>还没有动态</b><span>主页只展示内容，不再堆叠个人资料字段。</span></div>'}
function renderPost(p){const media=renderPostMedia(p);const scene=(p.scene||p.location)?'<div class="scene-line">'+(p.scene?'<span class="scene-chip">'+esc(p.scene)+'</span>':'')+(p.location?'<span>'+esc(p.location)+'</span>':'')+'</div>':'';const owner=currentView==="owner"?'<div class="owner-menu"><button onclick="editPost(\''+p.id+'\')">编辑</button><button class="danger" onclick="deletePost(\''+p.id+'\')">删除</button><span>'+visibilityLabel(p.visibility)+'</span></div>':'';return '<article class="post"><div class="post-head"><div class="mini-avatar">'+esc((profile.name||"H").charAt(0).toUpperCase())+'</div><div><div class="post-name-line"><span class="post-name">'+esc(profile.name)+'</span><span class="post-time">'+esc(p.createdAt||"刚刚")+'</span></div></div><button class="post-menu">⋯</button></div><div class="post-body">'+(p.text?'<div class="post-text">'+esc(p.text)+'</div>':'')+scene+media+'<div class="post-actions"><button>♡ 喜欢</button><button>◯ 回复</button><button>↗ 分享</button></div>'+owner+'</div></article>'}
function renderPostMedia(p){const arr=p.media||[];if(!arr.length)return "";const shown=arr.slice(0,4),cls=shown.length===1?"one":shown.length===2?"two":shown.length===3?"three":"four";return '<div class="post-media '+cls+'">'+shown.map((src,i)=>'<button class="media-cell" onclick="openViewer(\''+p.id+'\','+i+')"><img src="'+src+'" alt="动态照片">'+(i===3&&arr.length>4?'<span class="more-media">+'+(arr.length-4)+'</span>':'')+'</button>').join("")+'</div>'}
function mediaItems(){const out=[];posts.filter(visiblePost).forEach(p=>(p.media||[]).forEach((src,i)=>out.push({postId:p.id,index:i,src,caption:[p.text,p.location].filter(Boolean).join(" · "),visibility:p.visibility})));return out}
function renderMedia(){const items=mediaItems();mediaGrid.innerHTML=items.length?items.map((m,i)=>'<button onclick="openMediaViewer('+i+')"><img src="'+m.src+'" alt="照片">'+(currentView==="owner"&&m.visibility!=="public"?'<span class="media-private">'+visibilityLabel(m.visibility)+'</span>':'')+'</button>').join(""):'<div class="empty" style="grid-column:1/-1"><b>还没有照片</b><span>带照片的动态会自动出现在这里。</span></div>'}
function renderRecords(){const list=[{icon:"✓",title:"身份已验证",sub:"Proxy 完成真实性校验",right:"已完成"},{icon:"42",title:"42 次已履约",sub:"平台内可验证记录",right:"98% 准时"},{icon:"↻",title:"7 次复购",sub:"来自已完成服务",right:"稳定"}];records.innerHTML=list.map(x=>'<div class="record"><div class="record-icon">'+x.icon+'</div><div><b>'+x.title+'</b><span>'+x.sub+'</span></div><strong>'+x.right+'</strong></div>').join("")}

function setPage(n,animate=true){currentPage=Math.max(0,Math.min(2,n));track.classList.toggle("dragging",!animate);track.style.transform='translateX('+(-currentPage*33.333333)+'%)';document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===currentPage));setTimeout(()=>track.classList.remove("dragging"),0)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setPage(+t.dataset.page));
pager.addEventListener("touchstart",e=>{const t=e.changedTouches[0];dragStartX=t.clientX;dragStartY=t.clientY;dragging=false;baseTranslate=-currentPage*window.innerWidth},{passive:true});
pager.addEventListener("touchmove",e=>{const t=e.changedTouches[0],dx=t.clientX-dragStartX,dy=t.clientY-dragStartY;if(!dragging){if(Math.abs(dx)<10)return;if(Math.abs(dx)<=Math.abs(dy)*1.15)return;dragging=true}if(dragging){track.classList.add("dragging");const pageW=Math.min(430,window.innerWidth);let px=-currentPage*pageW+dx;if((currentPage===0&&dx>0)||(currentPage===2&&dx<0))px=-currentPage*pageW+dx*.28;track.style.transform='translateX('+px+'px)'}},{passive:true});
pager.addEventListener("touchend",e=>{if(!dragging)return;const dx=e.changedTouches[0].clientX-dragStartX;track.classList.remove("dragging");if(Math.abs(dx)>55)setPage(currentPage+(dx<0?1:-1));else setPage(currentPage)} ,{passive:true});

function openComposer(id=null){editingPostId=id;draftMedia=[];if(id){const p=posts.find(x=>x.id===id);if(!p)return;composerTitle.textContent="编辑动态";postText.value=p.text||"";postScene.value=p.scene||"";postLocation.value=p.location||"";postVisibility.value=p.visibility||"public";draftMedia=[...(p.media||[])]}else{composerTitle.textContent="发布动态";postText.value="";postScene.value="";postLocation.value="";postVisibility.value="public"}renderDraftMedia();composerMask.classList.add("show")}
function closeComposer(){composerMask.classList.remove("show");editingPostId=null;draftMedia=[]}
function renderDraftMedia(){uploadRow.innerHTML=draftMedia.map((src,i)=>'<div class="upload-thumb"><img src="'+src+'"><button onclick="draftMedia.splice('+i+',1);renderDraftMedia()">×</button></div>').join("")+'<button class="upload-add" onclick="fileInput.click()">＋</button>'}
function handleFiles(e){const files=[...e.target.files];if(!files.length)return;Promise.all(files.map(f=>resizeImage(f,1600,.84))).then(arr=>{draftMedia.push(...arr);renderDraftMedia();e.target.value=""})}
function resizeImage(file,maxSize,quality){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,maxSize/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};img.src=r.result};r.readAsDataURL(file)})}
function savePost(){const text=postText.value.trim();if(!text&&!draftMedia.length){alert("写点内容或添加照片");return}if(editingPostId){const p=posts.find(x=>x.id===editingPostId);p.text=text;p.scene=postScene.value;p.location=postLocation.value.trim();p.visibility=postVisibility.value;p.media=[...draftMedia]}else{posts.unshift({id:"t"+Date.now(),text,scene:postScene.value,location:postLocation.value.trim(),visibility:postVisibility.value,createdAt:"刚刚",media:[...draftMedia]})}persist();closeComposer();renderAll();setPage(0)}
function editPost(id){openComposer(id)}
function deletePost(id){if(confirm("删除这条动态？照片页也会同步移除其中的照片。")){posts=posts.filter(x=>x.id!==id);persist();renderAll()}}

function openProfileEditor(){editName.value=profile.name;editHandle.value=profile.handle;editBio.value=profile.bio;editCity.value=profile.city;profileMask.classList.add("show")}
function closeProfileEditor(){profileMask.classList.remove("show")}
function saveProfile(){profile.name=editName.value.trim()||"Huyen";profile.handle=editHandle.value.trim()||"@huyen";profile.bio=editBio.value.trim();profile.city=editCity.value.trim();persist();closeProfileEditor();renderAll()}

function openViewer(postId,index){const items=mediaItems();const target=items.findIndex(x=>x.postId===postId&&x.index===index);viewerItems=items;viewerIndex=Math.max(0,target);updateViewer();viewer.classList.add("show");document.body.style.overflow="hidden"}
function openMediaViewer(i){viewerItems=mediaItems();viewerIndex=i;updateViewer();viewer.classList.add("show");document.body.style.overflow="hidden"}
function closeViewer(){viewer.classList.remove("show");document.body.style.overflow=""}
function updateViewer(){if(!viewerItems.length){closeViewer();return}const x=viewerItems[viewerIndex];viewerImage.src=x.src;viewerCounter.textContent=(viewerIndex+1)+" / "+viewerItems.length;viewerCaption.textContent=x.caption||"";document.querySelector(".viewer-prev").style.visibility=viewerIndex===0?"hidden":"visible";document.querySelector(".viewer-next").style.visibility=viewerIndex===viewerItems.length-1?"hidden":"visible"}
function viewerStep(d){const n=viewerIndex+d;if(n<0||n>=viewerItems.length)return;viewerIndex=n;updateViewer()}
viewerStage.addEventListener("touchstart",e=>viewerStartX=e.changedTouches[0].clientX,{passive:true});viewerStage.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-viewerStartX;if(Math.abs(dx)>45)viewerStep(dx<0?1:-1)},{passive:true});document.addEventListener("keydown",e=>{if(!viewer.classList.contains("show"))return;if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")viewerStep(-1);if(e.key==="ArrowRight")viewerStep(1)});

applyProfile();setView("stranger");setPage(0,false);
</script>
</body>
