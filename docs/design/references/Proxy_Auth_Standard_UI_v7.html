<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proxy Auth</title>
<style>
:root{--bg:#fafafa;--ink:#111;--muted:#888;--line:#e1e1df;--accent:#f4a61d;--soft:#fff7e8}
*{box-sizing:border-box}html,body{margin:0;background:#f3f3f1;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:min(390px,100vw);height:min(844px,100vh);background:var(--bg);border:1px solid #d8d8d6;border-radius:34px;overflow:hidden;position:relative}
.status{height:52px;padding:18px 22px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:700}.screen{position:absolute;inset:52px 0 0;display:none}.screen.active{display:block}.content{height:100%;overflow:auto;padding:40px 28px 112px}
h1{margin:0 0 8px;font-size:31px;letter-spacing:-.8px}.sub{color:var(--muted);font-size:15px;margin-bottom:28px}
.rem{display:none;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:17px;padding:12px;margin-bottom:22px}.rem.show{display:flex}
.av{width:40px;height:40px;border-radius:13px;background:#111;color:white;display:grid;place-items:center;font-weight:800}.acct{flex:1;min-width:0}.acct b{display:block;font-size:14px}.acct span{display:block;font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont{border:0;background:#111;color:#fff;border-radius:11px;height:38px;padding:0 13px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px}.tab{position:relative;border:0;background:transparent;padding:0 2px 13px;font-size:16px;font-weight:700;color:#999}.tab.on{color:#111}.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#111}
.stack{display:grid;gap:12px}.row{width:100%;height:60px;border:1px solid var(--line);background:#fff;border-radius:16px;display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left}.row b{font-size:16px}
.icon{width:28px;height:28px;display:grid;place-items:center}.icon svg{width:26px;height:26px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.g{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;background:conic-gradient(#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75%)}
.guest{margin-top:26px;width:100%;border:0;background:transparent;color:#777;font-size:14px;font-weight:650;padding:10px}.guest svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8;vertical-align:-4px;margin-right:7px}
.back{position:absolute;top:7px;left:15px;width:44px;height:44px;border:0;background:transparent;font-size:31px}.topline{font-size:13px;color:var(--muted);margin-bottom:30px}
.input{width:100%;height:58px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 15px;font-size:16px;outline:none;margin-bottom:12px}.primary,.secondary{width:100%;height:58px;border-radius:15px;font-size:16px;font-weight:750}.primary{border:0;background:#111;color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#111;margin-top:12px}
.googleline{width:100%;height:58px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700}.divider{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;color:#aaa;font-size:12px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line)}
.code{display:grid;grid-template-columns:1fr 116px;gap:10px}.codebtn{border:1px solid var(--line);background:#fff;border-radius:15px;font-weight:700}.mark{width:68px;height:68px;border:1.5px solid var(--accent);border-radius:50%;display:grid;place-items:center;margin:28px auto 20px}.mark svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.7}
.center{text-align:center}.badge{display:inline-block;padding:6px 10px;background:var(--soft);color:#8c5b00;border-radius:999px;font-size:12px;margin-bottom:14px}.legal{position:absolute;left:28px;right:28px;bottom:34px;text-align:center;color:#aaa;font-size:12px}.bottom{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:122px;height:5px;border-radius:99px;background:#111}.demo{position:absolute;right:14px;bottom:22px;border:1px solid var(--line);background:#fff;color:#888;border-radius:999px;padding:7px 9px;font-size:10px}
</style></head><body><div class="wrap"><div class="phone"><div class="status"><span>9:41</span><span>●●● Wi‑Fi ▰</span></div>
<section class="screen active" id="auth"><div class="content"><h1>欢迎</h1><div class="sub" id="sub">登录你的账号</div>
<div id="rem" class="rem"><div class="av" id="av">G</div><div class="acct"><b>继续使用</b><span id="acc">th••••@gmail.com</span></div><button class="cont" onclick="show('app')">继续</button></div>
<div class="tabs"><button class="tab on" id="lt" onclick="modeSet('login')">登录</button><button class="tab" id="rt" onclick="modeSet('register')">注册</button></div>
<div class="stack"><button class="row" onclick="openGE()"><span class="icon"><span class="g">G</span></span><b>Google / 邮箱</b></button>
<button class="row" onclick="openPhone()"><span class="icon"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10 18.5h4"/></svg></span><b>手机号</b></button></div>
<button class="guest" onclick="show('guest')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15 9-2 5-5 2 2-5 5-2Z"/></svg>访客模式</button></div><div class="legal">继续即表示同意《用户协议》与《隐私政策》</div></section>
<section class="screen" id="ge"><button class="back" onclick="show('auth')">‹</button><div class="content" style="padding-top:74px"><div class="topline" id="getop">登录 · Google / 邮箱</div><h1 id="getitle">继续登录</h1><div class="sub">选择 Google，或输入邮箱</div><button class="googleline" onclick="finish('google')"><span class="g">G</span><span id="gact">使用 Google 登录</span></button><div class="divider">或</div><input id="email" class="input" placeholder="邮箱地址"><button class="primary" id="eact" onclick="show('code')">使用邮箱登录</button></div></section>
<section class="screen" id="code"><button class="back" onclick="show('ge')">‹</button><div class="content" style="padding-top:74px"><div class="topline">邮箱验证</div><h1>输入验证码</h1><div class="sub">验证码已发送到你的邮箱</div><input class="input" placeholder="6 位验证码"><button class="primary" onclick="finish('email')">继续</button></div></section>
<section class="screen" id="phone"><button class="back" onclick="show('auth')">‹</button><div class="content" style="padding-top:74px"><div class="topline" id="ptop">登录 · 手机号</div><h1 id="ptitle">使用手机号登录</h1><div class="sub">短信验证码</div><input id="phonein" class="input" placeholder="+84 手机号"><div class="code"><input class="input" placeholder="验证码" style="margin:0"><button class="codebtn">获取验证码</button></div><button class="primary" id="pact" style="margin-top:12px" onclick="finish('phone')">登录</button></div></section>
<section class="screen" id="guest"><button class="back" onclick="show('auth')">‹</button><div class="content center"><div class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15 9-2 5-5 2 2-5 5-2Z"/></svg></div><h1>访客模式</h1><div class="sub">无需登录，先浏览公开内容</div><button class="primary" onclick="show('guesthome')">进入</button></div></section>
<section class="screen" id="done"><div class="content"><span class="badge" id="db">已登录</span><h1 id="dt">登录成功</h1><div class="sub">这里接回 Proxy 首页</div><button class="primary" onclick="show('app')">进入 Proxy</button></div></section>
<section class="screen" id="app"><div class="content"><span class="badge">已登录</span><h1>Proxy</h1><div class="sub">主原型首页接入点</div><button class="secondary" onclick="logout()">退出登录</button></div></section>
<section class="screen" id="guesthome"><div class="content"><span class="badge">访客</span><h1>公开首页</h1><div class="sub">访客浏览态</div><button class="primary" onclick="show('auth')">登录 / 注册</button></div></section>
<button class="demo" onclick="toggle()">演示历史账号</button><div class="bottom"></div></div></div>
<script>
let mode='login';
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='auth')render()}
function remembered(){return localStorage.getItem('proxy_remembered')==='1'}
function render(){rem.classList.toggle('show',mode==='login'&&remembered());acc.textContent=localStorage.getItem('proxy_account')||'th••••@gmail.com'}
function modeSet(m){mode=m;let l=m==='login';lt.classList.toggle('on',l);rt.classList.toggle('on',!l);sub.textContent=l?'登录你的账号':'创建新的 Proxy 账号';render()}
function openGE(){let l=mode==='login';getop.textContent=(l?'登录':'注册')+' · Google / 邮箱';getitle.textContent=l?'继续登录':'创建账号';gact.textContent='使用 Google '+(l?'登录':'注册');eact.textContent='使用邮箱'+(l?'登录':'注册');show('ge')}
function openPhone(){let l=mode==='login';ptop.textContent=(l?'登录':'注册')+' · 手机号';ptitle.textContent='使用手机号'+(l?'登录':'注册');pact.textContent=l?'登录':'注册';show('phone')}
function finish(type){let a='th••••@gmail.com';if(type==='email'&&email.value.includes('@')){let s=email.value.split('@');a=(s[0].slice(0,2)||'**')+'••••@'+s[1]}if(type==='phone'&&phonein.value){let d=phonein.value.replace(/\D/g,'');a=d.length>=4?'•••• '+d.slice(-4):'手机号'}localStorage.setItem('proxy_remembered','1');localStorage.setItem('proxy_account',a);db.textContent=mode==='login'?'已登录':'已注册';dt.textContent=mode==='login'?'登录成功':'注册成功';show('done')}
function logout(){localStorage.clear();modeSet('login');show('auth')}
function toggle(){if(remembered())localStorage.clear();else{localStorage.setItem('proxy_remembered','1');localStorage.setItem('proxy_account','th••••@gmail.com')}render()}
render()
</script></body></html>
