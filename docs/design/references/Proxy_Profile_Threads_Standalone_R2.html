<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Proxy · Personal Profile · Threads Study R2</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC",Arial,sans-serif;color:#111}button{font:inherit;cursor:pointer}.stage{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#fff;border-radius:38px;overflow:hidden;position:relative;box-shadow:0 18px 55px rgba(0,0,0,.12)}.screen{position:absolute;inset:0;overflow:auto;padding:0 18px 88px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.status{height:38px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 2px 8px;font-size:10px;font-weight:800}.tools{height:46px;display:flex;align-items:center;justify-content:space-between}.toolset{display:flex;gap:5px}.iconbtn{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;padding:0}.iconbtn:active{background:#f3f3f3}.iconbtn svg{width:20px;height:20px;stroke:#111}.head{display:grid;grid-template-columns:1fr 86px;gap:16px;align-items:start;padding-top:7px}.name h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.04em}.handle{font-size:10px;color:#444;margin-top:4px}.avawrap{position:relative;width:82px;height:82px;justify-self:end}.ava{width:82px;height:82px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:850;border:1px solid #ececec}.add{position:absolute;left:-6px;bottom:-2px;width:32px;height:32px;border-radius:50%;border:3px solid #fff;background:#fff;display:grid;place-items:center}.add:before{content:"";position:absolute;inset:2px;border:1.5px dashed #aaa;border-radius:50%}.add svg{width:15px;height:15px;stroke:#333;z-index:1}.bio{margin-top:13px}.bio p{font-size:11px;line-height:1.48;margin:0}.link{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:8.5px;color:#4c4c4c}.link svg{width:12px;height:12px;stroke:#666}.link button{border:0;background:transparent;padding:0;font-size:8.5px;color:#333;font-weight:650}.topics{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.topic{border:1px solid #e1e1e1;background:#fff;border-radius:999px;padding:6px 10px;font-size:8px;color:#333;font-weight:600}.stat{margin-top:12px;color:#8c8c8c;font-size:8.5px}.stat button,.followers button{border:0;background:transparent;padding:0;color:inherit;font-size:inherit}.followers{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:8.8px;color:#7f7f7f}.faces{display:flex}.face{width:19px;height:19px;border-radius:50%;border:2px solid #fff;background:#d7d7d7;display:grid;place-items:center;font-size:6px;font-weight:900;color:#555;margin-left:-5px}.face:first-child{margin-left:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 13px}.actions button{height:38px;border:1px solid #dedede;background:#fff;border-radius:10px;font-size:9px;font-weight:750}.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #e9e9e9;margin:0 -18px;position:sticky;top:0;background:#fff;z-index:5}.tabs button{height:45px;border:0;background:#fff;color:#999;font-size:8.5px;font-weight:700;position:relative}.tabs button.on{color:#111}.tabs button.on:after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1.5px;background:#111}.thread{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid #e9e9e9}.aw{position:relative}.ta{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}.stem{position:absolute;left:17px;top:42px;bottom:-14px;width:1px;background:#e5e5e5}.ph{display:flex;align-items:center;gap:5px}.ph b{font-size:10px}.check{width:13px;height:13px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:7px}.ph time{margin-left:auto;color:#999;font-size:8px}.pt{font-size:10.3px;line-height:1.52;margin-top:3px}.media{height:225px;border:1px solid #eee;border-radius:11px;background:linear-gradient(145deg,#eee8f0,#e7edf1);margin-top:9px}.tag{display:inline-flex;border:1px solid #e6e6e6;border-radius:999px;padding:3px 7px;font-size:7.2px;color:#777;margin-top:7px}.pa{display:flex;gap:19px;margin-top:10px}.pa button{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:4px;color:#555;font-size:8.5px}.pa svg{width:16px;height:16px;stroke:#444}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -18px}.tile{aspect-ratio:1;background:linear-gradient(145deg,#eee8f0,#e7edf1);border:0}.empty{padding:38px 12px;text-align:center;color:#888;font-size:9px}.foot{padding:15px 0}.foot h3{font-size:11px;margin:0}.foot p{font-size:8.5px;color:#777;line-height:1.45}.map{height:145px;border:1px solid #eee;border-radius:13px;background:linear-gradient(25deg,#eeebef,#f9f7fa);position:relative;overflow:hidden}.road{position:absolute;height:7px;background:#fff;border-radius:8px}.r1{width:120%;left:-10%;top:36%;transform:rotate(-14deg)}.r2{width:100%;left:0;top:66%;transform:rotate(10deg)}.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;border:4px solid #fff;box-shadow:0 0 0 1px #ddd}.p1{left:25%;top:26%}.p2{left:56%;top:52%}.p3{left:72%;top:29%}.footrow{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #e9e9e9}.mark{width:30px;height:30px;border-radius:9px;background:#f4f4f4;display:grid;place-items:center}.mark svg{width:15px;height:15px;stroke:#555}.footrow b{font-size:9.5px}.footrow span{display:block;font-size:7.7px;color:#777;margin-top:2px}.bottom{position:absolute;left:18px;right:18px;bottom:10px;height:62px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border:1px solid #ececec;border-radius:22px;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;z-index:20}.bottom button{border:0;background:transparent;border-radius:16px;color:#aaa;font-size:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottom svg{width:19px;height:19px;stroke:currentColor}.bottom .on{color:#111;background:#fafafa}.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:50;display:none;align-items:flex-end;padding:12px}.sheetbg.show{display:flex}.sheet{width:100%;background:#fff;border-radius:22px;padding:17px;max-height:72%;overflow:auto}.sheet h3{font-size:15px;margin:0 0 4px}.sheet p{font-size:9px;color:#777;margin:0 0 12px}.field{border:1px solid #e6e6e6;border-radius:12px;padding:9px;margin:8px 0}.field label{display:block;font-size:8px;color:#777}.field input,.field textarea{width:100%;border:0;outline:0;font:inherit;font-size:10px;margin-top:4px;resize:none}.wide{width:100%;height:38px;border:1px solid #ddd;background:#fff;border-radius:11px;font-size:9px;font-weight:700;margin-top:7px}.wide.dark{background:#111;color:#fff;border-color:#111}
</style></head><body><div class="stage"><div class="phone"><div class="screen" id="screen"></div><nav class="bottom"><button><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4Z" stroke-width="1.7"/></svg>首页</button><button><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke-width="1.7"/><path d="m15 9-2 5-5 2 2-5Z" stroke-width="1.7"/></svg>市场</button><button><svg viewBox="0 0 24 24" fill="none"><path d="M5 12a7 7 0 1 0 14 0 7 7 0 0 0-14 0Z" stroke-width="1.7"/><path d="M8 12c1.2-2.1 3.2-3.2 6-3.2" stroke-width="1.7"/></svg>动态</button><button><svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14v10H9l-4 3Z" stroke-width="1.7"/></svg>信息</button><button class="on"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke-width="1.7"/><path d="M5.5 20c.5-4 2.7-6 6.5-6s6 2 6.5 6" stroke-width="1.7"/></svg>我的</button></nav><div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div></div></div><script>
const screenEl=document.getElementById('screen');const sheetBgEl=document.getElementById('sheetbg');const sheetEl=document.getElementById('sheet');
const I={insights:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke-width="1.8"/><path d="M8 16v-4m4 4V8m4 8v-6" stroke-width="1.8" stroke-linecap="round"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke-width="1.8"/><path d="m16 16 4 4" stroke-width="1.8" stroke-linecap="round"/></svg>',insta:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="5" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" stroke-width="1.8"/><circle cx="17.3" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h14" stroke-width="1.8" stroke-linecap="round"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 7v10M7 12h10" stroke-width="1.8" stroke-linecap="round"/></svg>',link:'<svg viewBox="0 0 24 24" fill="none"><path d="m9 15 6-6M8 18l-2 2a3 3 0 0 1-4-4l3-3a3 3 0 0 1 4 0m7-7 2-2a3 3 0 0 1 4 4l-3 3a3 3 0 0 1-4 0" stroke-width="1.6" stroke-linecap="round"/></svg>',heart:'<svg viewBox="0 0 24 24" fill="none"><path d="M20 8.8c0 5.4-8 10.2-8 10.2S4 14.2 4 8.8A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8 2.8Z" stroke-width="1.7"/></svg>',reply:'<svg viewBox="0 0 24 24" fill="none"><path d="M20 11.5a7.5 7.5 0 1 1-3.2-6.1A7.5 7.5 0 0 1 20 11.5Z" stroke-width="1.7"/><path d="m7 18-1 3 3-1" stroke-width="1.7"/></svg>',repost:'<svg viewBox="0 0 24 24" fill="none"><path d="M7 7h9l-2.5-2.5M17 17H8l2.5 2.5M18 7l-2 2M6 17l2-2" stroke-width="1.7" stroke-linecap="round"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none"><path d="m4 5 16 7-16 7 3-7-3-7Z" stroke-width="1.7"/></svg>',pin:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z" stroke-width="1.7"/><circle cx="12" cy="10" r="2.1" stroke-width="1.7"/></svg>'};let state={tab:'THREADS',bio:'喜欢咖啡、拍照和找本地小店。',topics:['咖啡','拍照','本地生活'],link:'instagram.com/huyen.nguyen'};function showSheet(html){sheetEl.innerHTML=html;sheetBgEl.classList.add('show')}function closeSheet(){sheetBgEl.classList.remove('show')}function tools(){return `<div class="tools"><div class="toolset"><button class="iconbtn" onclick="insights()">${I.insights}</button></div><div class="toolset"><button class="iconbtn" onclick="search()">${I.search}</button><button class="iconbtn" onclick="instagram()">${I.insta}</button><button class="iconbtn" onclick="menu()">${I.menu}</button></div></div>`}function header(){return `<div class="status"><span>9:41</span><span>● ◔ ▰</span></div>${tools()}<div class="head"><div class="name"><h1>Huyền</h1><div class="handle">huyen.nguyen</div></div><div class="avawrap"><div class="ava">H</div><button class="add" onclick="newPost()">${I.plus}</button></div></div><div class="bio"><p>${state.bio}</p><div class="link">${I.link}<button onclick="instagram()">${state.link}</button></div><div class="topics">${state.topics.map(x=>`<button class="topic" onclick="topic('${x}')">${x}</button>`).join('')}</div><div class="stat"><button onclick="insights()"><b>12.8K 次浏览</b> · 最近 30 天 ›</button></div><div class="followers"><div class="faces"><span class="face">M</span><span class="face">A</span><span class="face">L</span></div><button onclick="followers()"><strong>128 位关注者</strong></button></div></div><div class="actions"><button onclick="edit()">编辑个人资料</button><button onclick="share()">分享个人资料</button></div>`}const tabs=[['THREADS','帖文'],['REPLIES','回复'],['MEDIA','媒体'],['REPOSTS','转发'],['FEEDS','Feeds']];function tabbar(){return `<div class="tabs">${tabs.map(([k,l])=>`<button class="${state.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`}const post1={time:'昨天',text:'最近想多去一些没有去过的小店，不一定要热门，舒服最重要。',tag:'本地探索',likes:21,replies:5,reposts:1};const post2={time:'1 小时',text:'周六下午有人想一起找家好看的咖啡店互相拍照吗？不收服务费，各自点自己的饮料就行。',tag:'河内生活',likes:48,replies:11,reposts:3,media:true};function post(p){return `<article class="thread"><div class="aw"><div class="ta">H</div><span class="stem"></span></div><div><div class="ph"><b>Huyền</b><span class="check">✓</span><time>${p.time}</time></div><div class="pt">${p.text}</div>${p.media?'<div class="media"></div>':''}<span class="tag">${p.tag}</span><div class="pa"><button>${I.heart}<span>${p.likes}</span></button><button>${I.reply}<span>${p.replies}</span></button><button>${I.repost}<span>${p.reposts}</span></button><button>${I.send}</button></div></div></article>`}function body(){if(state.tab==='THREADS')return post(post1)+post(post2);if(state.tab==='REPLIES')return `<div class="thread"><div class="aw"><div class="ta">H</div></div><div><div class="ph"><b>Huyền</b><span class="check">✓</span><time>3 小时</time></div><div class="pt">可以呀，如果不赶时间我更喜欢傍晚一点，光线会舒服很多。</div><div class="tag">回复 @Mai</div></div></div>`;if(state.tab==='MEDIA')return `<div class="grid"><button class="tile"></button><button class="tile" style="background:linear-gradient(145deg,#e8edf1,#f0e8ec)"></button><button class="tile" style="background:linear-gradient(145deg,#f0eee8,#e9ecf1)"></button></div>`;if(state.tab==='REPOSTS')return `<div class="empty"><b>还没有更多转发</b>转发的公开内容会集中出现在这里。</div>`;return `<div class="empty"><b>公开 Feeds</b>你创建或公开分享的自定义 Feed 会出现在这里。这里不放二维码、Scene 或 Available 管理。</div>`}function render(){screenEl.innerHTML=header()+tabbar()+body()}function setTab(k){state.tab=k;render()}function insights(){showSheet('<h3>Insights</h3><p>最近 30 天</p><div class="field"><label>浏览</label><b>12.8K</b></div><div class="field"><label>互动</label><b>684</b></div><div class="field"><label>新增关注</label><b>+31</b></div><button class="wide dark" onclick="closeSheet()">完成</button>')}function search(){showSheet('<h3>搜索 Threads</h3><p>找人、主题和公开对话。</p><div class="field"><input autofocus placeholder="搜索"></div><button class="wide dark" onclick="closeSheet()">搜索</button>')}function instagram(){showSheet('<h3>Instagram</h3><p>@huyen.nguyen · 公开链接</p><button class="wide" onclick="closeSheet()">关闭</button>')}function menu(){showSheet('<h3>主页设置</h3><p>管理主页、隐私和设置。</p><button class="wide" onclick="edit()">编辑个人资料</button><button class="wide" onclick="closeSheet()">隐私</button><button class="wide dark" onclick="closeSheet()">完成</button>')}function edit(){showSheet(`<h3>编辑个人资料</h3><p>只编辑公开主页信息。</p><div class="field"><label>简介</label><textarea id="bio">${state.bio}</textarea></div><div class="field"><label>链接</label><input id="link" value="${state.link}"></div><div class="field"><label>话题</label><input id="topics" value="${state.topics.join(' · ')}"></div><button class="wide dark" onclick="saveEdit()">完成</button>`)}function saveEdit(){const bioEl=document.getElementById('bio'),linkEl=document.getElementById('link'),topicsEl=document.getElementById('topics');state.bio=(bioEl?.value||'').trim()||state.bio;state.link=(linkEl?.value||'').trim()||state.link;state.topics=(topicsEl?.value||'').split(/[·,，]/).map(x=>x.trim()).filter(Boolean).slice(0,10);closeSheet();render()}function share(){showSheet('<h3>分享个人资料</h3><p>只走标准分享，不提供二维码。</p><button class="wide" onclick="closeSheet()">复制主页链接</button><button class="wide" onclick="closeSheet()">分享到信息</button><button class="wide dark" onclick="closeSheet()">完成</button>')}function newPost(){showSheet('<h3>新建帖文</h3><p>主页头像旁的 + 与 Threads 一样直接进入发布。</p><div class="field"><textarea placeholder="有什么新鲜事？"></textarea></div><button class="wide dark" onclick="closeSheet()">发布</button>')}function topic(t){showSheet(`<h3>${t}</h3><p>查看这个话题里的公开对话。</p><button class="wide dark" onclick="closeSheet()">完成</button>`)}function followers(){showSheet('<h3>128 位关注者</h3><p>关注关系列表。</p><button class="wide dark" onclick="closeSheet()">完成</button>')}render();
</script></body></html>
