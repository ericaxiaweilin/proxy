<head>

<style>

.phone{width:100%;max-width:410px;min-height:840px;background:var(--bg);border:1px solid #D9D4C9;border-radius:31px;padding:12px 12px 11px;position:relative;overflow:hidden}

.screen{padding:4px 4px 78px;min-height:780px}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 10px}
.header h1{font-size:25px;letter-spacing:-.7px;margin:0}.header p{font-size: 11px;color:var(--muted);margin:3px 0 0}
.head-actions{display:flex;gap:6px}.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;font-size:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#EDEAE3;border-radius:13px;padding:4px;margin-bottom:11px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 7px;font-size: 11px;font-weight:900}.tabs button.on{background:#fff}
.contextbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:10px}
.contextbar div{min-width:0}.contextbar b{font-size: 11px;display:block}.contextbar span{font-size: 11px;color:var(--muted);display:block;margin-top:2px}.contextbar button{border:0;background:var(--soft);border-radius:9px;padding:7px 8px;font-size: 11px;font-weight:850}
.filters{display:flex;gap:6px;overflow:auto;padding:1px 0 6px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 9px;font-size: 11px;white-space:nowrap}.filters button.on{background:var(--accent);border-color:var(--accent);font-weight:900}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:10px 2px 6px}
.sectionhead b{font-size:12px}.sectionhead span{font-size: 11px;color:var(--muted)}
.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:12px;margin:8px 0}
.price-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.price-cell{background:var(--soft);border-radius:10px;padding:8px;min-width:0}.price-cell.hot{background:var(--accent-soft)}
.price-cell span{display:block;font-size: 11px;color:var(--muted)}.price-cell b{display:block;font-size:11px;margin-top:2px;line-height:1.2}
.opp-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.opp-top b{font-size:12px;line-height:1.35}.opp-top strong{font-size:13px;white-space:nowrap}

.actions{display:flex;gap:7px;margin-top:9px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size: 11px;font-weight:900}.actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}.actions .accent{background:var(--accent);border-color:var(--accent)}
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:14px;margin-bottom:10px}.hero small{font-size: 11px;color:#CDC8BF}.hero h2{font-size:19px;line-height:1.25;margin:4px 0}.hero p{font-size: 11px;color:#D8D4CA;line-height:1.45;margin:0}
.backhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;margin:4px 0 9px}.backhead b{font-size:13px}.back{border:0;background:transparent;font-size:22px;padding:0 8px 0 0}.more{border:0;background:transparent;font-size:17px}
.requester{display:flex;gap:9px;align-items:center}.logo,.avatar{width:42px;height:42px;border-radius:13px;background:var(--accent);display:grid;place-items:center;font-weight:950;flex:0 0 auto}.requester .copy,.personcopy{flex:1;min-width:0}.requester b,.personcopy b{font-size: 11px;display:block}.requester span,.personcopy span{font-size: 11px;color:var(--muted);display:block;margin-top:2px}.verified{font-size: 11px;font-weight:900;background:var(--good);color:var(--good-ink);border-radius:999px;padding:5px 6px}
.factgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.fact{background:var(--soft);border-radius:10px;padding:8px}.fact span{display:block;font-size: 11px;color:var(--muted)}.fact b{display:block;font-size: 11px;margin-top:2px;line-height:1.3}
.ai{border:1px solid var(--line);background:var(--accent-soft);border-radius:15px;padding:10px;margin:8px 0}.ai .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.ai b{font-size: 11px}.ai strong{font-size:11px}.ai p{font-size: 11px;color:#6E6249;line-height:1.4;margin:4px 0 0}
.checks{display:grid;gap:5px;margin-top:7px}.check{display:flex;gap:6px;align-items:flex-start;font-size: 11px;line-height:1.35}.check i{width:18px;height:18px;border-radius:6px;background:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;flex:0 0 auto}
.valuebox{border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px;margin:8px 0}.valuebox .headline{display:flex;justify-content:space-between;gap:10px;align-items:center}.valuebox .headline b{font-size: 11px}.valuebox .headline strong{font-size:15px}.valuebar{height:8px;background:#EEEAE1;border-radius:999px;overflow:hidden;margin:7px 0 5px}.valuebar i{display:block;height:100%;background:var(--accent);width:72%;border-radius:999px}.valuebox p{font-size: 11px;color:var(--muted);line-height:1.4;margin:0}
.quote-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.quote-option{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;text-align:left}.quote-option.on{border-color:var(--accent);background:var(--accent-soft)}.quote-option b{display:block;font-size:11px}.quote-option span{display:block;font-size: 11px;color:var(--muted);margin-top:2px;line-height:1.3}
.field{margin:8px 0}.field label{display:flex;justify-content:space-between;gap:8px;font-size: 11px;color:var(--muted);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;font-size: 11px;outline:0}.field textarea{height:70px;resize:none}
.lineitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-top:1px solid #EEEAE2}.lineitem:first-child{border-top:0}.lineitem span{font-size: 11px;color:var(--muted)}.lineitem b{font-size: 11px;text-align:right}
.offer-summary{background:var(--ink);color:#fff;border-radius:15px;padding:11px;margin:9px 0}.offer-summary span{display:block;font-size: 11px;color:#CFCAC0}.offer-summary b{display:block;font-size:18px;margin-top:2px}.offer-summary p{font-size: 11px;color:#D8D4CA;line-height:1.4;margin:4px 0 0}
.chat{display:grid;gap:8px}.bubble{max-width:86%;border-radius:14px;padding:9px 10px;font-size: 11px;line-height:1.4}.bubble.them{background:#fff;border:1px solid var(--line)}.bubble.me{background:var(--accent-soft);margin-left:auto}.bubble small{display:block;font-size: 11px;color:var(--muted);margin-top:4px}
.negotiation-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.negotiation-tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size: 11px;font-weight:850}
.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0 10px}.pipeline div{background:var(--soft);border-radius:10px;padding:8px 3px;text-align:center}.pipeline div.on{background:var(--accent-soft)}.pipeline b{display:block;font-size:12px}.pipeline span{font-size: 11px;color:var(--muted)}
.select-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.select-tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size: 11px;font-weight:850}.select-tools button.on{background:var(--accent-soft);border-color:var(--accent)}
.candidate{border:1px solid var(--line);background:#fff;border-radius:16px;padding:11px;margin:8px 0}.candidate.rec{border-color:var(--accent)}
.personrow{display:flex;align-items:center;gap:8px}.avatar{width:44px;height:44px}.rank{font-size: 11px;font-weight:900;background:var(--accent-soft);padding:5px 6px;border-radius:999px}

.reasonrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.reasonrow span{background:var(--soft);border-radius:8px;padding:5px 6px;font-size: 11px}

.profilehero{border:1px solid var(--line);background:#fff;border-radius:17px;padding:12px}.profiletop{display:flex;align-items:center;gap:10px}.profiletop .avatar{width:54px;height:54px;border-radius:16px}.profiletop .personcopy b{font-size:13px}.profiletop .personcopy span{font-size: 11px}.profiletop button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;font-size: 11px;font-weight:850}
.profilefacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.profilefacts div{background:var(--soft);border-radius:10px;padding:7px}.profilefacts b{font-size: 11px;display:block}.profilefacts span{font-size: 11px;color:var(--muted)}

}

idden;text-overflow:ellipsis}.apcopy span{display:block;font-size: 11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aprank{font-size: 11px;background:var(--accent-soft);border-radius:999px;padding:4px 5px;font-weight:900;white-space:nowrap}.apattrs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:7px}.apattrs div{background:var(--soft);border-radius:8px;padding:6px;min-width:0}.apattrs span{display:block;font-size: 11px;color:var(--muted)}.apattrs b{display:block;font-size: 11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.apprice{display:flex;justify-content:space-between;gap:7px;align-items:end;border-top:1px solid #EEEAE2;margin-top:7px;padding-top:7px}.apprice span{font-size: 11px;color:var(--muted)}.apprice b{font-size:11px}.apchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.apchips span{font-size: 11px;background:var(--soft);border-radius:999px;padding:4px 5px}.apwhy{font-size: 11px;color:var(--muted);line-height:1.35;margin-top:6px;height:28px;overflow:hidden}.apactions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.apactions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 4px;font-size: 11px;font-weight:900}.apactions button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.poolmore{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;margin-top:8px;font-size: 11px;font-weight:850}.poolfootnote{font-size: 11px;color:var(--muted);line-height:1.4;margin:8px 2px 0}@media(max-width:365px){.applicantgrid{grid-template-columns:1fr}}


/* R7 · Opportunity primary filter navigation
   Fixed footprint, icon-first, no rainbow, no shadow. */
.oppQuickNav{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:5px;
  margin:8px 0 10px;
}
.oppQuickBtn{
  position:relative;
  min-width:0;
  min-height:58px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:7px 2px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:var(--muted);
}
.oppQuickBtn .oppIcon{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
}
.oppQuickBtn svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.oppQuickBtn b{
  display:block;
  font-size: 11px;
  line-height:1;
  letter-spacing:.02em;
  white-space:nowrap;
}
.oppQuickBtn.on{
  color:var(--ink);
  background:var(--accent-soft);
  border-color:var(--accent);
}
.oppQuickBtn.on .oppIcon{
  color:#A86C00;
}
.oppQuickBtn .badge{
  position:absolute;
  top:4px;
  right:5px;
  min-width:15px;
  height:15px;
  padding:0 4px;
  border-radius:999px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:var(--ink);
  border:2px solid #fff;
  font-size: 11px;
  font-weight:950;
  line-height:1;
}
.oppQuickHint{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
  margin:0 2px 7px;
}
.oppQuickHint .copy{
  min-width:0;
}
.oppQuickHint b{
  display:block;
  font-size: 11px;
}
.oppQuickHint span{
  display:block;
  font-size: 11px;
  color:var(--muted);
  margin-top:2px;

function activity(){
 state.tab='act';
 return header('act','河内 · 现实活动')+
 `<div class="filters"><button class="on">推荐</button><button>本周末</button><button>附近</button><button>摄影</button><button>咖啡</button><button>品牌</button></div>
 <div class="sectionhead"><b>正在发生</b><span>活动不是人才货架</span></div>
 ${['周末摄影散步|西湖 · 周六 15:30 · 8 / 12 人|共同兴趣','Coffee & Founder Chat|还剑 · 周四 18:30 · 12 / 20 人|创业 / 产品','Bonsaidon Creator Night|周五 19:00 · 商家发起 · 公开报名|品牌活动'].map(x=>{

 }).join('')}`;

function render(){
 let x='';
 if(state.scene==='market')x=market();
 if(state.scene==='detail')x=detail();
 if(state.scene==='quote')x=quote();
 if(state.scene==='negotiate')x=negotiate();
 if(state.scene==='profile')x=profile();
 if(state.scene==='publish')x=publish();
 if(state.scene==='select')x=select();
 if(state.scene==='pool')x=pool();
 if(state.scene==='submission')x=submission();
 if(state.scene==='applicant')x=applicant();
 if(state.scene==='compare')x=compare();
 if(state.scene==='activity')x=activity();
 document.getElementById('screen').innerHTML=x;
 bind();
}
function go(s){
 state.scene=s;
 if(s==='market')state.tab='opp';
 if(s==='activity')state.tab='act';
 document.querySelectorAll('.scene').forEach(b=>b.classList.toggle('on',b.dataset.scene===s));
 render();
}
function bind(){
 document.querySelectorAll('[data-opp-filter]').forEach(b=>b.addEventListener('click',()=>setOppFilter(b.dataset.oppFilter)));
 document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.back)));
 document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;go(b.dataset.tab==='act'?'activity':'market')}));
 document.querySelectorAll('.openOpp').forEach(b=>b.addEventListener('click',()=>go('detail')));
 let e;
 e=document.getElementById('goQuote'); if(e)e.addEventListener('click',()=>go('quote'));
 e=document.getElementById('profileQuick'); if(e)e.addEventListener('click',()=>go('profile'));
 e=document.getElementById('publishBtn'); if(e)e.addEventListener('click',()=>go('publish'));
 e=document.getElementById('sendOffer'); if(e)e.addEventListener('click',()=>go('negotiate'));
 e=document.getElementById('goCompare'); if(e)e.addEventListener('click',()=>go('compare'));
 e=document.getElementById('goCompare2'); if(e)e.addEventListener('click',()=>go('compare'));
 e=document.getElementById('openPool'); if(e)e.addEventListener('click',()=>go('pool'));
 e=document.getElementById('poolCompare'); if(e)e.addEventListener('click',()=>go('compare'));
 document.querySelectorAll('.poolPerson').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.person==='mei')go('applicant');else alert('其他候选也会进入同结构的完整候选详情页；当前原型重点展开小美。')}));
 document.querySelectorAll('.poolOffer').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.person==='mei')go('submission');else alert('其他候选也会进入自己的本次 Offer 详情；当前原型重点展开小美。')}));
 e=document.getElementById('cmpProfile'); if(e)e.addEventListener('click',()=>go('applicant'));
 document.querySelectorAll('.openProfile').forEach(b=>b.addEventListener('click',()=>go('profile')));
 document.querySelectorAll('.openApplicant').forEach(b=>b.addEventListener('click',()=>{
   if((b.dataset.name||'').includes('小美')) go('applicant');
   else alert('其他候选也会进入各自的候选详情页。当前原型重点展示小美。');
 }));
 document.querySelectorAll('.openSubmission').forEach(b=>b.addEventListener('click',()=>{
   if((b.dataset.name||'').includes('小美')) go('submission');
   else alert('其他候选同样进入各自的本次投递详情。当前原型重点展示小美。');
 }));
 e=document.getElementById('submissionProfile'); if(e)e.addEventListener('click',()=>go('profile'));
 e=document.getElementById('submissionPortfolio'); if(e)e.addEventListener('click',()=>go('profile'));
 e=document.getElementById('applicantAllPortfolio'); if(e)e.addEventListener('click',()=>go('profile'));
 e=document.getElementById('applicantSubmission'); if(e)e.addEventListener('click',()=>go('submission'));
 e=document.getElementById('applicantCompare'); if(e)e.addEventListener('click',()=>go('compare'));
 e=document.getElementById('backCandidates'); if(e)e.addEventListener('click',()=>go('select'));
 e=document.getElementById('compareFromSubmission'); if(e)e.addEventListener('click',()=>go('compare'));
 e=document.getElementById('askXiaomei'); if(e)e.addEventListener('click',()=>alert('进入本次需求上下文聊天：问题、回答和报价都保留在当前 Opportunity 内。'));

 document.querySelectorAll('[data-qmode]').forEach(b=>b.addEventListener('click',()=>{
   state.quoteMode=b.dataset.qmode;
   state.quote = state.quoteMode==='budget'?2000000:state.quoteMode==='standard'?2200000:state.quoteMode==='premium'?2500000:2300000;
   render();
 }));
 e=document.getElementById('aiQuote'); if(e)e.addEventListener('click',()=>alert('Proxy：2.2M₫ 位于公平区间内，也接近你的历史中位数。当前范围与报价匹配。'));
 e=document.getElementById('publishDone'); if(e)e.addEventListener('click',()=>{alert('需求已发布。小美看到客户预算 + Proxy 公平区间，并可自由报价。');go('select')});
 e=document.getElementById('searchBtn'); if(e)e.addEventListener('click',()=>alert('搜索机会 / 活动。真人不作为公共搜索货架。'));
 document.querySelectorAll('.pick').forEach((b,i)=>b.addEventListener('click',()=>{state.winner=['小美','linh','minh'][i]||'小美';render()}));
}
document.querySelectorAll('.scene').forEach(b=>b.addEventListener('click',()=>go(b.dataset.scene)));
document.getElementById('navMarket').addEventListener('click',()=>go('market'));
document.querySelectorAll('.scene').forEach(b=>b.classList.toggle('on',b.dataset.scene===state.scene));
render();
</script>
