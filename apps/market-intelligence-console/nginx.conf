# 控制台的 nginx：端静态产物 + 把 /v1 转给 compose 网络里的 api。
#
# 为什么必须转：src/lib/api.ts 里 `const BASE = ""` —— 控制台把 /v1 当**同源 BFF**，
# 它自己不知道 API 在哪。本地开发靠 vite.config.ts 的 proxy，容器里就得靠这一段。
# 少了它，控制台能打开、但每一页都会停在「加载…」或报 404。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 控制台没有 URL 路由（page 是 useState），但刷新/直接开任意路径都要能回到首页，
    # 否则 404 页会让人以为服务挂了。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 注意 proxy_pass 结尾**没有**斜杠：有斜杠会把 /v1 前缀吃掉，
    # 后端收到的就是 /operator/matching，直接 404。
    location /v1/ {
        proxy_pass http://api:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 运营接口靠 Authorization: Bearer <session token>，必须原样透传。
        proxy_set_header Authorization $http_authorization;
        # 撮合留痕要读一批批次快照，比普通读接口慢；默认 60s 够，别用默认的 30s。
        proxy_read_timeout 60s;
    }
}
