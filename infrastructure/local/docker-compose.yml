services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: proxy
      POSTGRES_DB: proxy
    ports:
      - "5432:5432"
    volumes:
      - proxy_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proxy
      MINIO_ROOT_PASSWORD: proxysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - proxy_minio_data:/data

volumes:
  proxy_postgres_data:
  proxy_minio_data:
